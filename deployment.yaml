apiVersion: apps/v1
kind: Deployment
metadata:
  name: placement-portal
  labels:
    app: placement-portal
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: placement-portal
  template:
    metadata:
      labels:
        app: placement-portal
    spec:
      containers:
      - name: portal-container
        image: YOUR_DOCKERHUB_USERNAME/placement-portal:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        # Readiness/Liveness probes aid in automated failure identification
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
